<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бро Трекер</title>
    <!-- Подключаем скрипт Telegram с принудительной версией -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f0f2f5);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        button {
            background-color: #248bcf;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Бро, версия КОДА: 2.0 🦾</h1>

    <div class="card">
        <h3>💧 Трекер воды</h3>
        <p>Выпито за сегодня: <strong id="water-count">0</strong> мл</p>
        <button onclick="addWater()">Выпить 250 мл</button>
    </div>

    <div class="card">
        <h3>🧘‍♂️ Борьба с кифозом</h3>
        <button onclick="showWorkout()">План упражнений</button>
    </div>

    <script>
        // Инициализация
        const tg = window?.Telegram?.WebApp;
        
        if (tg) {
            tg.ready(); // Сообщаем ТГ, что мы тут
            tg.expand(); // Разворачиваем
        }

        let water = 0;

        // Пытаемся вытащить воду из локальной памяти устройства (самый надежный способ)
        try {
            const savedWater = localStorage.getItem('water_today');
            if (savedWater) {
                water = parseInt(savedWater, 10);
                document.getElementById('water-count').innerText = water;
            }
        } catch (e) {
            alert("Ошибка чтения памяти: " + e);
        }

        function addWater() {
            water += 250;
            document.getElementById('water-count').innerText = water;
            
            // Сохраняем в локальную память смартфона
            try {
                localStorage.setItem('water_today', water.toString());
            } catch (e) {
                alert("Ошибка записи в память: " + e);
            }

            // Пробуем вызвать вибрацию всеми доступными в ТГ способами
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy'); // Поменял на heavy (сильный отклик)
            } else {
                alert("Telegram Haptic не найден!");
            }
        }

        function showWorkout() {
            alert("1. Лодочка (3 подхода)\n2. Растяжка у стены. Расправь плечи!");
        }
    </script>
</body>
</html>
