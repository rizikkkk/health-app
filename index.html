<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бро Фитнес Курс</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #f5f6f7); margin: 0; padding: 20px 20px 90px 20px; }
        h1, h2, h3 { margin-top: 0; color: var(--tg-theme-button-color, #5288c1); text-align: center; }
        .card { background: var(--tg-theme-secondary-bg-color, #202b36); padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #f5f6f7); font-size: 16px; box-sizing: border-box; }
        button { background-color: var(--tg-theme-button-color, #5288c1); color: var(--tg-theme-button-text-color, #ffffff); border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 5px; }
        .btn-success { background-color: #4caf50 !important; }
        .btn-stop { background-color: #f44336 !important; }
        .result-box { margin-top: 15px; padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.05); display: none; font-weight: bold; text-align: center; }
        .app-screen { display: none; }
        .app-screen.active { display: block; }
        
        /* Стили интерактивного режима тренировки */
        .workout-player { display: none; text-align: center; }
        .ex-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #e5a93b; }
        .ex-target { font-size: 28px; font-weight: bold; margin: 15px 0; color: var(--tg-theme-button-color, #5288c1); }
        .round-badge { font-size: 16px; font-weight: bold; color: #888; margin-bottom: 15px; text-transform: uppercase; }
        
        .timer-display { font-size: 48px; font-weight: bold; margin: 15px 0; color: #4caf50; display: none; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--tg-theme-secondary-bg-color, #202b36); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--tg-theme-text-color, #f5f6f7); opacity: 0.5; font-size: 12px; display: flex; flex-direction: column; align-items: center; cursor: pointer; width: auto; margin: 0; padding: 5px; }
        .nav-item .icon { font-size: 20px; margin-bottom: 3px; }
        .nav-item.active { opacity: 1; color: var(--tg-theme-button-color, #5288c1); }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="screen-main" class="app-screen active">
        <h1>Твой день, Бро 🦾</h1>
        <div class="card">
            <h3>💧 Трекер воды</h3>
            <p>Выпито за сегодня: <strong id="water-count" style="font-size: 20px; color: #5288c1;">0</strong> мл</p>
            <button onclick="addWater()">Выпить 250 мл</button>
        </div>
        <div class="card">
            <h3>📊 Текущий статус</h3>
            <p id="status-text">Заполни данные во вкладке «Параметры».</p>
        </div>
    </div>

    <!-- ЭКРАН 2: ПАРАМЕТРЫ -->
    <div id="screen-bmi" class="app-screen">
        <h2>Твои параметры</h2>
        <div class="card">
            <h3>📊 Расчет ИМТ</h3>
            <div class="input-group">
                <label>Рост (см):</label>
                <input type="number" id="bmi-height" placeholder="178" oninput="calculateBMI()">
            </div>
            <div class="input-group">
                <label>Вес (кг):</label>
                <input type="number" id="bmi-weight" placeholder="80" oninput="calculateBMI()">
            </div>
            <div id="bmi-result" class="result-box"></div>
        </div>
    </div>

    <!-- ЭКРАН 3: ТРЕНИРОВКИ -->
    <div id="screen-workout" class="app-screen">
        <h2>Домашний Фитнес-Курс 🏠</h2>
        
        <!-- Меню выбора программы -->
        <div id="workout-setup-card" class="card">
            <div class="input-group">
                <label>Выбери цель курса:</label>
                <select id="workout-category" onchange="togglePostureSub()">
                    <option value="none">-- Выбрать направление --</option>
                    <option value="posture">🧘‍♂️ Коррекция осанки (Интенсивный курс)</option>
                    <option value="fatburn">🔥 Похудение и Жиросжигание (Курс по нарастающей)</option>
                    <option value="power">💪 Прокачка мышц дома (Собственный вес)</option>
                </select>
            </div>
            <div class="input-group" id="sub-posture-group" style="display: none;">
                <label>Тип нарушения осанки:</label>
                <select id="posture-type">
                    <option value="kyphosis">Кифоз (Грудной отдел)</option>
                    <option value="slouch">Сутулость (Плечи)</option>
                    <option value="scoli">Сколиоз (Искривление)</option>
                </select>
            </div>
            <button class="btn-success" onclick="startWorkoutSession()">🚀 Начать курс тренировки</button>
        </div>

        <!-- ИНТЕРАКТИВНЫЙ ПЛЕЕР ТРЕНИРОВКИ -->
        <div id="workout-player-container" class="card workout-player">
            <div class="round-badge" id="player-round-info">ПОДХОД 1 ИЗ 3</div>
            <div class="ex-title" id="player-ex-name">Упражнение</div>
            <p id="player-ex-desc">Описание техники</p>
            <div class="ex-target" id="player-ex-target">15 РАЗ</div>
            
            <!-- Цифровой таймер (показывается только для статики) -->
            <div class="timer-display" id="player-timer-digits">00:45</div>
            
            <!-- Кнопки управления шагами -->
            <div id="player-controls">
                <button id="btn-action" class="btn-success" onclick="handleActionClick()">Выполнено</button>
                <button class="btn-stop" onclick="exitWorkoutSession()" style="margin-top:15px;">🛑 Прервать тренировку</button>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchScreen('screen-main', this)">
            <span class="icon">🏠</span><span>Главная</span>
        </button>
        <button class="nav-item" onclick="switchScreen('screen-bmi', this)">
            <span class="icon">📊</span><span>Параметры</span>
        </button>
        <button class="nav-item" onclick="switchScreen('screen-workout', this)">
            <span class="icon">🏋️‍♂️</span><span>Курс</span>
        </button>
    </nav>

    <script>
        const tg = window?.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // БАЗА ДАННЫХ ИНТЕНСИВНЫХ КУРСОВ (Без ИМТ ограничений, по нарастающей)
        const courseDatabase = {
            posture: {
                kyphosis: [
                    { name: "Лодочка со сведением лопаток", type: "reps", target: 15, desc: "Лежа на животе, оторви грудь от пола. Плавно своди лопатки, удерживая руки у головы." },
                    { name: "Упражнение 'Кобра'", type: "reps", target: 12, desc: "Лежа на животе, упрись ладонями и плавно вытяни грудной отдел вверх. Плечи опущены." },
                    { name: "Статическая планка для спины", type: "time", target: 45, desc: "Держи тело ровно. Пресс напряжен, лопатки разведены, держим позицию." }
                ],
                slouch: [
                    { name: "Y-T-W подъемы рук на животе", type: "reps", target: 12, desc: "Последовательно поднимай руки вверх, разводя их буквами Y, T и W. Качает заднюю дельту." },
                    { name: "Вращение плечами у стены", type: "reps", target: 20, desc: "Прижмись спиной и тазом к стене, выполняй круговые вращения плечами назад." }
                ],
                scoli: [
                    { name: "Боковая планка (Левая сторона)", type: "time", target: 30, desc: "Стабилизация косых мышц. Держи таз высоко, не проваливайся." },
                    { name: "Боковая планка (Правая сторона)", type: "time", target: 30, desc: "Симметричное укрепление мышечного корсета спины." }
                ]
            },
            fatburn: [
                { name: "Взрывные Берпи", type: "reps", target: 12, desc: "Упор лежа, отжимание, прыжок вверх с хлопком. Полный разгон жиросжигания!" },
                { name: "Приседания с выпрыгиванием", type: "reps", target: 15, desc: "Опускайся до параллели с полом и мощно выталкивай тело вверх в прыжок." },
                { name: "Упражнение 'Скалолаз'", type: "time", target: 45, desc: "В упоре лежа быстро поочередно подтягивай колени к груди. Держи темп!" }
            ],
            power: [
                { name: "Отжимания широким хватом", type: "reps", target: 12, desc: "Глубокие отжимания от пола. Фокус на проработку грудных мышц." },
                { name: "Обратные отжимания от стула", type: "reps", target: 15, desc: "Сядь на край стула, руки у бедер. Сделай шаг вперед тазом и опускайся вниз, качая трицепс." },
                { name: "Выпады назад попеременно", type: "reps", target: 16, desc: "Шаг назад, угол в коленях 90 градусов. Сделай по 8 раз на каждую ногу." }
            ]
        };

        // НАВИГАЦИЯ
        function switchScreen(id, btn) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        // ВОДА
        let water = parseInt(localStorage.getItem('water_today') || '0', 10);
        document.getElementById('water-count').innerText = water;
        function addWater() {
            water += 250; document.getElementById('water-count').innerText = water;
            localStorage.setItem('water_today', water.toString());
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        // ИМТ
        function calculateBMI() {
            const h = parseFloat(document.getElementById('bmi-height').value);
            const w = parseFloat(document.getElementById('bmi-weight').value);
            const res = document.getElementById('bmi-result');
            if (!h || !w) { res.style.display = 'none'; return; }
            localStorage.setItem('user_height', h); localStorage.setItem('user_weight', w);
            const bmi = (w / ((h/100) * (h/100))).toFixed(1);
            let txt = "", col = "#5288c1";
            if (bmi < 18.5) { txt = "Дефицит массы"; col = "#e5a93b"; }
            else if (bmi >= 18.5 && bmi < 25) { txt = "Нормальный вес"; col = "#4caf50"; }
            else { txt = "Избыточный вес"; col = "#f44336"; }
            res.style.display = 'block'; res.style.color = col;
            res.innerHTML = `ИМТ: ${bmi}<br><span style="font-size:13px;">${txt}</span>`;
            document.getElementById('status-text').innerText = `ИМТ: ${bmi} (${txt}). Курс тренировок готов к запуску.`;
        }

        function togglePostureSub() {
            const cat = document.getElementById('workout-category').value;
            document.getElementById('sub-posture-group').style.display = (cat === 'posture') ? 'block' : 'none';
        }

        // --- ДВИЖОК СИСТЕМЫ ПОДХОДОВ ТРЕНИРОВКИ ---
        let currentExercises = []; 
        let exIndex = 0;           
        let roundIndex = 1;        
        let timerInterval;         
        let isTimerRunning = false;

        function startWorkoutSession() {
            const cat = document.getElementById('workout-category').value;
            if (cat === 'none') { alert("Бро, выбери сначала цель тренировки!"); return; }

            if (cat === 'posture') {
                const type = document.getElementById('posture-type').value;
                currentExercises = courseDatabase.posture[type];
            } else {
                currentExercises = courseDatabase[cat];
            }

            if (!currentExercises || currentExercises.length === 0) return;

            exIndex = 0;
            roundIndex = 1;
            isTimerRunning = false;
            clearInterval(timerInterval);

            document.getElementById('workout-setup-card').style.display = 'none';
            document.getElementById('workout-player-container').style.display = 'block';

            showCurrentStep();
        }

        function showCurrentStep() {
            const ex = currentExercises[exIndex];
            const roundBadge = document.getElementById('player-round-info');
            const exName = document.getElementById('player-ex-name');
            const exDesc = document.getElementById('player-ex-desc');
            const exTarget = document.getElementById('player-ex-target');
            const timerDigits = document.getElementById('player-timer-digits');
            const btnAction = document.getElementById('btn-action');

            clearInterval(timerInterval);
            isTimerRunning = false;

            roundBadge.innerText = `ПОДХОД ${roundIndex} ИЗ 3`;
            exName.innerText = ex.name;
            exDesc.innerText = ex.desc;

            if (ex.type === "reps") {
                exTarget.innerText = `${ex.target} РАЗ`;
                timerDigits.style.display = 'none';
                btnAction.innerText = "Выполнено! Следующий подход";
                btnAction.className = "btn-success";
            } else {
                exTarget.innerText = `ДЕРЖИМ ВРЕМЯ`;
                timerDigits.style.display = 'block';
                timerDigits.innerText = `00:${ex.target}`;
                btnAction.innerText = "🟢 Запустить таймер подхода";
                btnAction.className = "btn-success";
            }
        }

        function handleActionClick() {
            const ex = currentExercises[exIndex];
            if (ex.type === "reps") {
                goToNextRound();
            } else {
                if (!isTimerRunning) {
                    startExerciseTimer(ex.target);
                } else {
                    goToNextRound();
                }
            }
        }

        function startExerciseTimer(seconds) {
            isTimerRunning = true;
            let timeLeft = seconds;
            const timerDigits = document.getElementById('player-timer-digits');
            const btnAction = document.getElementById('btn-action');

            btnAction.innerText = "Пропустить время";
            btnAction.className = "btn-stop";

            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDigits.innerText = `00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
                    goToNextRound();
                }
            }, 1000);
        }

        function goToNextRound() {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (roundIndex < 3) {
                roundIndex++;
                showCurrentStep();
            } else {
                roundIndex = 1;
                if (exIndex < currentExercises.length - 1) {
                    exIndex++;
                    alert("Отлично! Упражнение выполнено. Переходим к следующему! 🦾");
                    showCurrentStep();
                } else {
                    exitWorkoutSession();
                    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
                    alert("Бро, поздравляю! Ты полностью разорвал эту тренировку и выполнил все упражнения по 3 подхода! Крутейшая работа! 🔥🦾");
                }
            }
        }

        function exitWorkoutSession() {
            clearInterval(timerInterval);
            document.getElementById('workout-player-container').style.display = 'none';
            document.getElementById('workout-setup-card').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('bmi-height').value = localStorage.getItem('user_height') || '';
            document.getElementById('bmi-weight').value = localStorage.getItem('user_weight') || '';
            calculateBMI();
        });
    </script>
</body>
</html>
