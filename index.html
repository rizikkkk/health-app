<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бро Фитнес</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #f5f6f7); margin: 0; padding: 20px 20px 90px 20px; }
        h1, h2, h3 { margin-top: 0; color: var(--tg-theme-button-color, #5288c1); }
        .card { background: var(--tg-theme-secondary-bg-color, #202b36); padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #f5f6f7); font-size: 16px; box-sizing: border-box; }
        button { background-color: var(--tg-theme-button-color, #5288c1); color: var(--tg-theme-button-text-color, #ffffff); border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 5px; }
        .result-box { margin-top: 15px; padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.05); display: none; font-weight: bold; text-align: center; }
        .app-screen { display: none; }
        .app-screen.active { display: block; }
        .exercise-item { background: rgba(255, 255, 255, 0.03); border-left: 4px solid var(--tg-theme-button-color, #5288c1); padding: 12px; margin: 10px 0; border-radius: 0 10px 10px 0; }
        .exercise-meta { font-size: 13px; color: var(--tg-theme-button-color, #5288c1); font-weight: bold; margin-top: 4px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--tg-theme-secondary-bg-color, #202b36); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--tg-theme-text-color, #f5f6f7); opacity: 0.5; font-size: 12px; display: flex; flex-direction: column; align-items: center; cursor: pointer; width: auto; margin: 0; padding: 5px; }
        .nav-item .icon { font-size: 20px; margin-bottom: 3px; }
        .nav-item.active { opacity: 1; color: var(--tg-theme-button-color, #5288c1); }
                /* Стили для интерактивного таймера */
        .timer-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            text-align: center;
            border: 2px dashed var(--tg-theme-button-color, #5288c1);
        }
        .timer-digits {
            font-size: 36px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #5288c1);
            margin-bottom: 10px;
        }
        .timer-controls {
            display: flex;
            gap: 10px;
        }
        .btn-stop {
            background-color: #f44336 !important;
        }

    </style>
</head>
<body>

    <!-- ЭКРАН 1 -->
    <div id="screen-main" class="app-screen active">
        <h1>Твой день, Бро 🦾</h1>
        <div class="card">
            <h3>💧 Трекер воды</h3>
            <p>Выпито за сегодня: <strong id="water-count" style="font-size: 20px; color: #5288c1;">0</strong> мл</p>
            <button onclick="addWater()">Выпить 250 мл</button>
        </div>
        <div class="card">
            <h3>📊 Текущий статус</h3>
            <p id="status-text">Заполни данные во вкладке «Параметры».</p>
        </div>
    </div>

    <!-- ЭКРАН 2 -->
    <div id="screen-bmi" class="app-screen">
        <h2>Твои параметры</h2>
        <div class="card">
            <h3>📊 Расчет ИМТ</h3>
            <div class="input-group">
                <label>Рост (см):</label>
                <input type="number" id="bmi-height" placeholder="178" oninput="calculateBMI()">
            </div>
            <div class="input-group">
                <label>Вес (кг):</label>
                <input type="number" id="bmi-weight" placeholder="80" oninput="calculateBMI()">
            </div>
            <div id="bmi-result" class="result-box"></div>
        </div>
    </div>

    <!-- ЭКРАН 3 -->
    <div id="screen-workout" class="app-screen">
        <h2>Домашний Фитнес 🏠</h2>
        <div class="card">
            <div class="input-group">
                <label>Выбери направление:</label>
                <select id="workout-category" onchange="generateProgram()">
                    <option value="none">-- Выбрать цель --</option>
                    <option value="posture">🧘‍♂️ Коррекция осанки (Спина)</option>
                    <option value="fatburn">🔥 Похудение и Жиросжигание</option>
                    <option value="power">💪 Силовые тренировки (Мышцы)</option>
                </select>
            </div>
            <div class="input-group" id="sub-posture-group" style="display: none;">
                <label>Тип нарушения осанки:</label>
                <select id="posture-type" onchange="generateProgram()">
                    <option value="kyphosis">Кифоз (Грудной отдел)</option>
                    <option value="slouch">Сутулость (Плечи)</option>
                    <option value="scoli">Сколиоз (Искривление)</option>
                </select>
            </div>
        </div>
        <div id="workout-program-container"></div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchScreen('screen-main', this)">
            <span class="icon">🏠</span><span>Главная</span>
        </button>
        <button class="nav-item" onclick="switchScreen('screen-bmi', this)">
            <span class="icon">📊</span><span>Параметры</span>
        </button>
        <button class="nav-item" onclick="switchScreen('screen-workout', this)">
            <span class="icon">🏋️‍♂️</span><span>Тренировки</span>
        </button>
    </nav>

    <script>
        const tg = window?.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        function switchScreen(id, btn) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        let water = parseInt(localStorage.getItem('water_today') || '0', 10);
        document.getElementById('water-count').innerText = water;

        function addWater() {
            water += 250;
            document.getElementById('water-count').innerText = water;
            localStorage.setItem('water_today', water.toString());
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        let bmiCat = localStorage.getItem('bmi_category') || 'normal';

        function calculateBMI() {
            const h = parseFloat(document.getElementById('bmi-height').value);
            const w = parseFloat(document.getElementById('bmi-weight').value);
            const res = document.getElementById('bmi-result');
            if (!h || !w) { res.style.display = 'none'; return; }
            
            localStorage.setItem('user_height', h);
            localStorage.setItem('user_weight', w);
            const bmi = (w / ((h/100) * (h/100))).toFixed(1);
            let txt = ""; let col = "#5288c1";

            if (bmi < 18.5) { txt = "Дефицит массы"; col = "#e5a93b"; bmiCat = "deficit"; }
            else if (bmi >= 18.5 && bmi < 25) { txt = "Нормальный вес"; col = "#4caf50"; bmiCat = "normal"; }
            else { txt = "Избыточный вес"; col = "#f44336"; bmiCat = "excess"; }

            localStorage.setItem('bmi_category', bmiCat);
            res.style.display = 'block'; res.style.color = col;
            res.innerHTML = `ИМТ: ${bmi}<br><span style="font-size:13px;">${txt}</span>`;
            document.getElementById('status-text').innerText = `ИМТ: ${bmi} (${txt}).`;
            generateProgram();
        }

        function generateProgram() {
            const cat = document.getElementById('workout-category').value;
            const sub = document.getElementById('sub-posture-group');
            const comp = document.getElementById('workout-program-container');
            if (cat === 'none') { sub.style.display = 'none'; comp.innerHTML = ""; return; }

            let title = "", exList = [];
            sub.style.display = (cat === 'posture') ? 'block' : 'none';

            if (cat === 'posture') {
                const type = document.getElementById('posture-type').value;
                if (type === 'kyphosis') { title = "🧘‍♂️ Комплекс Анти-Кифоз"; exList = [{n:"Лодочка статическая", m:"3х20 сек", d:"Лежа на животе, своди лопатки."}, {n:"Кобра", m:"3х12 раз", d:"Прогиб в грудном отделе."}]; }
                if (type === 'slouch') { title = "🧍‍♂️ Коррекция Сутулости"; exList = [{n:"Замок за спиной", m:"3х30 сек", d:"Соединяй пальцы рук сзади."}, {n:"Вращение плечами", m:"3х20 раз", d:"Круговые движения плечами назад."}]; }
                if (type === 'scoli') { title = "📐 Стабилизация (Сколиоз)"; exList = [{n:"Боковая планка", m:"3х20 сек", d:"Укрепляет косые мышцы."}, {n:"Поза ребенка", m:"3х45 сек", d:"Мягкое вытяжение спины."}]; }
            } else if (cat === 'fatburn') {
                if (bmiCat === 'deficit') { title = "⚠️ Внимание: Низкий ИМТ"; exList = [{n:"Легкий тонус", m:"3х30 сек", d:"Кардио должно быть умеренным."}, {n:"Планка", m:"3х30 сек", d:"Укрепление мышц кора."}]; }
                if (bmiCat === 'normal') { title = "🔥 Жиросжигание Интенсив"; exList = [{n:"Берпи", m:"3х10 раз", d:"Разгон метаболизма."}, {n:"Скалолаз", m:"3х45 сек", d:"Подтяжка колен к груди в упоре."}]; }
                if (bmiCat === 'excess') { title = "🔥 Похудение (Без прыжков)"; exList = [{n:"Приседания на стул", m:"3х15 раз", d:"Безопасно для коленей."}, {n:"Планка с колен", m:"3х45 сек", d:"Нагрузка на пресс без давления."}]; }
            } else if (cat === 'power') {
                if (bmiCat === 'deficit') { title = "💪 Работа на объем (Масса)"; exList = [{n:"Отжимания", m:"4х10 раз", d:"Медленный темп, качаем грудь."}, {n:"Медленные приседания", m:"4х12 раз", d:"3 секунды вниз, взрыв вверх."}]; }
            if (bmiCat === 'normal') { title = "💪 Домашний рельеф и сила"; exList = [{n:"Отжимания с паузой", m:"4х12 раз", d:"Задержка на 1 сек в нижней точке."}, {n:"Выпады назад", m:"3х12 раз", d:"Прокачка ног дома."}]; }
            if (bmiCat === 'excess') { title = "💪 Силовой тонус суставов"; exList = [{n:"Отжимания от стола", m:"4х12 раз", d:"Снижает нагрузку на руки."}, {n:"Ягодичный мостик", m:"3х20 раз", d:"Безопасно для спины."}]; }
        }

        let html = `<div class="card"><h3>${title}</h3><div>`;
        exList.forEach(e => { html += `<div class="exercise-item"><strong>${e.n}</strong><p style="margin:4px 0; font-size:13px; opacity:0.7;">${e.d}</p><div class="exercise-meta">⏱ ${e.m}</div></div>`; });
                    // Добавляем блок скрытого таймера и зеленую кнопку запуска подхода
            html += `</div>
                <div id="timer-section" class="timer-box">
                    <div class="timer-digits" id="timer-count-down">00:45</div>
                    <button onclick="stopTimer()" class="btn-stop">🛑 Стоп / Сбросить</button>
                </div>
                <button onclick="startTrigger()" style="margin-top:15px; background-color:#4caf50;">🦾 Начать подход</button>
            </div>`;

        comp.innerHTML = html;
    }

        // Переменные для управления временем
        let countdown;
        let timeLeft = 45;

        function startTrigger() { 
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium'); 
            
            // Сбрасываем старый таймер, если он работал
            clearInterval(countdown);
            timeLeft = 45; // Ставим 45 секунд на подход
            
            const timerBox = document.getElementById('timer-section');
            const timerDigits = document.getElementById('timer-count-down');
            
            if (timerBox && timerDigits) {
                timerBox.style.display = 'block';
                timerDigits.innerText = `00:${timeLeft}`;
                
                // Запускаем тиканье каждую секунду
                countdown = setInterval(() => {
                    timeLeft--;
                    
                    // Форматируем вывод
                    timerDigits.innerText = `00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;
                    
                    // Легкий виброотклик на каждую секунду (эффект тиканья часов)
                    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        timerDigits.innerText = "ФИНИШ! 🔥";
                        
                        // Мощное финальное вибро
                        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
                        alert("Отличный подход, Бро! Отдохни немного и продолжай.");
                    }
                }, 1000);
            }
        }

        function stopTimer() {
            clearInterval(countdown);
            const timerBox = document.getElementById('timer-section');
            if (timerBox) timerBox.style.display = 'none';
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('bmi-height').value = localStorage.getItem('user_height') || '';
            document.getElementById('bmi-weight').value = localStorage.getItem('user_weight') || '';
            calculateBMI();
        });
    </script>
</body>
</html>
