<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бро Трекер</title>
    <!-- Подключаем скрипт Telegram с принудительной версией -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f0f2f5);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        button {
            background-color: #248bcf;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Бро, версия КОДА: 2.0 🦾</h1>

    <div class="card">
        <h3>💧 Трекер воды</h3>
        <p>Выпито за сегодня: <strong id="water-count">0</strong> мл</p>
        <button onclick="addWater()">Выпить 250 мл</button>
    </div>

    <div class="card">
        <h3>🧘‍♂️ Борьба с кифозом</h3>
        <button onclick="showWorkout()">План упражнений</button>
    </div>

    <script>
// Переменная для хранения воды
let water = 0;

// Функция для обновления цифры на экране
function updateWaterDisplay(value) {
    water = value;
    const waterDisplay = document.getElementById('water-count');
    if (waterDisplay) {
        waterDisplay.innerText = water;
    }
}

// Загружаем сохраненную воду сразу при старте страницы
try {
    const savedWater = localStorage.getItem('water_today');
    if (savedWater) {
        updateWaterDisplay(parseInt(savedWater, 10));
    }
} catch (e) {
    console.log("Ошибка чтения памяти:", e);
}

// Функция, которая сработает, когда Telegram полностью загрузит свой интерфейс
function initTelegram() {
    const tg = window?.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }
}

// Слушаем сигнал от Telegram о полной готовности
window.addEventListener('DOMContentLoaded', initTelegram);

// Функция добавления воды
function addWater() {
    water += 250;
    updateWaterDisplay(water);
    
    // Сохраняем в память смартфона
    try {
        localStorage.setItem('water_today', water.toString());
    } catch (e) {
        console.log("Ошибка записи в память:", e);
    }

    // Пробуем вызвать вибрацию аккуратно, без всплывающих окон
    const tg = window?.Telegram?.WebApp;
    if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('heavy'); 
    }
}

function showWorkout() {
    alert("Бро, твой план на сегодня:\n1. Лодочка (3 подхода)\n2. Растяжка грудного отдела у стены.\n\nРасправь плечи прямо сейчас! 🧘‍♂️");
}

    </script>
</body>
</html>
